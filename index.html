<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Hello, World!</h1>
    <p id="welcome-text">My name is Mussie, and I am learning web development.</p>

    <h2>My Learning Goals:</h2>
    <ul>
        <li>Master HTML & CSS</li>
        <li>Learn JavaScript Programming</li>
        <li>Build Full Web Applications</li>
    </ul>

    <!-- Toggle Button with matching ID -->
    <button id="click-btn">Click Me!</button>

    <!-- Flexbox Feature Section -->
    <div class="features-container">
        <div class="feature-box">HTML5</div>
        <div class="feature-box">CSS3</div>
        <div class="feature-box">JavaScript</div>
    </div>

    <hr>

    <!-- Live API Data Generator Section -->
    <div class="api-section">
        <h2>Live API Data Generator</h2>
        <p id="fact-display">Click the button to load a live fact from the web!</p>
        <button id="fetch-btn">Get Live Fact</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
